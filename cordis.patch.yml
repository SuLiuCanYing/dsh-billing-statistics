# dsh-billing-statistics bundle: 采集模型调用计量并在侧栏提供计费统计页面。
- insert:
    - id: dsh-billing-statistics
      name: 'dsh-billing-statistics'
      config:
        retainDays: 30
        showCost: true
        # models.dev 价格目录：每天自动刷新一次（当天没开程序则下次启动补刷）。
        # 匹配不到的模型在页面里用「人工导入价格」直接填。
        priceSync: true
